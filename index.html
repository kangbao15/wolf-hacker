
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolf Hacker</title>
  <link rel="icon" href="https://raw.githubusercontent.com/kangbao15/wolf-hacker/main/icon.ico">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 600px;
      padding: 40px 24px;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .version {
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid #444;
      border-radius: 20px;
      color: #bbb;
      font-size: 13px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 12px;
    }

    p {
      color: #aaa;
      font-size: 16px;
      line-height: 1.6;
      margin: 0 auto 28px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 6px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      transition: 0.2s;
    }

    a:hover {
      opacity: 0.8;
      transform: translateY(-2px);
    }

    a.secondary {
      background: #252525;
      color: #fff;
      border: 1px solid #444;
    }

    footer {
      margin-top: 55px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 34px;
      }

      .buttons {
        flex-direction: column;
      }

      .buttons a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <img
      class="logo"
      src="https://raw.githubusercontent.com/kangbao15/wolf-hacker/main/icon.ico"
      alt="Wolf Hacker Logo"
    >

    <div class="version">RELEASE v1.0.0</div>

    <h1>Wolf Hacker</h1>

    <p>
      Enter the world of Wolf Hacker.
      Play online or download the Windows version.
    </p>

    <div class="buttons">
      <a href="https://kangbao15.github.io/wolf-play/wolf-hacker">
        ▶ Chơi ngay
      </a>

      <a class="secondary"
         href="https://github.com/kangbao15/wolf-hacker/releases/download/v1.0.0/Wolf.Hacker.Setup.1.0.0.exe">
        ↓ Download
      </a>

      <a class="secondary"
         href="https://github.com/kangbao15/wolf-hacker">
        GitHub
      </a>
    </div>

    <footer>
      Wolf Hacker · v1.0.0 · KangBao15
    </footer>
  </main>
</body>
</html>
