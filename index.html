
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Hacker</title>
    <link rel="icon" href="https://raw.githubusercontent.com/kangbao15/wolf-hacker/main/icon.ico">
    <meta name="theme-color" content="#0b0b0f">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 24px;
        }

        .release {
            display: inline-block;
            color: #a78bfa;
            border: 1px solid #6d45c5;
            background: #1a122b;
            padding: 6px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 14px;
            letter-spacing: -1px;
        }

        .description {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 15px 20px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        .play {
            background: #7c3aed;
            color: white;
        }

        .download {
            background: #fff;
            color: #111;
        }

        .github {
            background: #202027;
            color: #ddd;
            border: 1px solid #34343d;
        }

        footer {
            margin-top: 35px;
            color: #666;
            font-size: 12px;
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <img
            class="logo"
            src="https://raw.githubusercontent.com/kangbao15/wolf-hacker/main/icon.ico"
            alt="Wolf Hacker Logo"
        >

        <div class="release">RELEASE v1.0.0</div>

        <h1>Wolf Hacker</h1>

        <p class="description">
            Trải nghiệm Wolf Hacker ngay trên trình duyệt
            hoặc tải phiên bản Windows về máy tính.
        </p>

        <div class="buttons">
            <a class="btn play"
               href="https://kangbao15.github.io/wolf-play/wolf-hacker">
                ▶ Chơi ngay
            </a>

            <a class="btn download"
               href="https://github.com/kangbao15/wolf-hacker/releases/download/v1.0.0/Wolf.Hacker.Setup.1.0.0.exe">
                ↓ Download for Windows
            </a>

            <a class="btn github"
               href="https://github.com/kangbao15/wolf-hacker"
               target="_blank" rel="noopener noreferrer">
                GitHub
            </a>
        </div>

        <footer>
            Wolf Hacker · v1.0.0 · KangBao15
        </footer>
    </main>
</body>
</html>
