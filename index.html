<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolf Hacker</title>
  <link rel="icon" type="image/x-icon"
    href="https://raw.githubusercontent.com/kangbao15/wolf-hacker/main/icon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(130, 70, 210, 0.35),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(75, 35, 120, 0.3),
          transparent 40%
        ),
        #08080c;
    }

    .card {
      width: min(900px, 100%);
      padding: 45px;

      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;

      background: rgba(20, 18, 27, 0.72);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.5);
    }

    .content {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .logo {
      width: 190px;
      height: 190px;

      object-fit: contain;
      flex-shrink: 0;

      filter:
        drop-shadow(0 15px 30px rgba(130, 80, 220, 0.25));
    }

    .info {
      flex: 1;
    }

    .tag {
      display: inline-block;

      margin-bottom: 14px;
      padding: 6px 12px;

      border-radius: 999px;

      background: rgba(150, 90, 230, 0.14);
      border: 1px solid rgba(180, 130, 255, 0.2);

      color: #c9a9ff;

      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    h1 {
      margin-bottom: 16px;

      font-size: clamp(40px, 6vw, 64px);
      line-height: 1;

      letter-spacing: -2px;
    }

    p {
      max-width: 560px;

      margin-bottom: 28px;

      color: #aaa7b4;

      font-size: 17px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 14px 23px;

      border-radius: 14px;

      background: #9b63e8;
      color: #fff;

      text-decoration: none;

      font-size: 16px;
      font-weight: 700;

      box-shadow:
        0 10px 30px rgba(155, 99, 232, 0.25);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .download:hover {
      transform: translateY(-2px);

      background: #aa76ef;

      box-shadow:
        0 14px 35px rgba(155, 99, 232, 0.35);
    }

    .download:active {
      transform: translateY(0);
    }

    .play-web {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 14px 23px;

      border-radius: 14px;

      background: transparent;
      border: 1px solid rgba(180, 130, 255, 0.4);
      color: #c9a9ff;

      text-decoration: none;

      font-size: 16px;
      font-weight: 700;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .play-web:hover {
      transform: translateY(-2px);

      background: rgba(150, 90, 230, 0.14);
      border-color: rgba(180, 130, 255, 0.7);
    }

    .play-web:active {
      transform: translateY(0);
    }

    .github {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 14px 20px;

      border-radius: 14px;

      border: 1px solid rgba(255, 255, 255, 0.12);

      color: #ddd;

      text-decoration: none;

      font-size: 16px;
      font-weight: 600;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .github:hover {
      transform: translateY(-2px);

      background: rgba(255, 255, 255, 0.07);
    }

    .version {
      margin-top: 22px;

      color: #777480;

      font-size: 13px;
    }

    @media (max-width: 650px) {
      .card {
        padding: 30px 24px;
      }

      .content {
        flex-direction: column;
        text-align: center;
      }

      .logo {
        width: 150px;
        height: 150px;
      }

      p {
        margin-left: auto;
        margin-right: auto;
      }

      .actions {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="content">

      <img
        class="logo"
        src="https://raw.githubusercontent.com/kangbao15/wolf-hacker/main/icon.ico"
        alt="Wolf Hacker"
      >

      <section class="info">

        <span class="tag">
          RELEASE v1.0.0
        </span>

        <h1>
          Wolf Hacker
        </h1>

        <p>
          Tải Wolf Hacker phiên bản 1.0.0
          trực tiếp từ GitHub Releases.
        </p>

        <div class="actions">

          <a
            class="download"
            href="https://github.com/kangbao15/wolf-hacker/releases/download/v1.0.0/Wolf.Hacker.Setup.1.0.0.exe"
            download
          >
            ↓&nbsp; Download
          </a>

          <a
            class="play-web"
            href="https://kangbao15.github.io/wolf-play/wolf-hacker"
          >
            🎮&nbsp; Chơi trên trình duyệt
          </a>

          <a
            class="github"
            href="https://github.com/kangbao15/wolf-hacker"
            target="_blank"
            rel="noopener"
          >
            GitHub
          </a>

        </div>

        <div class="version">
          Wolf Hacker · v1.0.0
        </div>

      </section>

    </div>

  </main>

</body>
</html>
